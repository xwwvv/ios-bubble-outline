name: Build DEX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build DEX
        run: ./gradlew --no-daemon :app:packageDex

      - name: Generate actual.json
        run: |
          VERSION=$(cat version.txt)
          printf '{"version":"%s","dex":"bubble-outline.dex"}\n' "$VERSION" > outputs/actual.json
          cat outputs/actual.json

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs
          git diff --cached --quiet || git commit -m "Build DEX" -m "Generated by GitHub Actions"
          git push