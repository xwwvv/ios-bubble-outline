import org.gradle.internal.os.OperatingSystem

plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.myplugin.outline"
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    def stubJar = file("libs/telegram-stubs.jar")
    if (stubJar.exists()) {
        compileOnly files(stubJar.absolutePath)
    }
}

def isWindows = OperatingSystem.current().isWindows()

def findLatestBuildTools(File buildToolsDir) {
    File latest = null
    buildToolsDir.eachDir { dir ->
        if (latest == null || dir.name > latest.name) {
            latest = dir
        }
    }
    return latest
}

afterEvaluate {
    def kotlinTask = tasks.findByName("compileReleaseKotlin")
    def javacTask = tasks.findByName("compileReleaseJavaWithJavac")

    tasks.register("classesJar", Jar) {
        if (kotlinTask != null) {
            dependsOn(kotlinTask)
        }
        if (javacTask != null) {
            dependsOn(javacTask)
        }
        archiveFileName = "classes.jar"
        destinationDirectory = file("${buildDir}/intermediates")
        from("${buildDir}/tmp/kotlin-classes/release")
        from("${buildDir}/intermediates/javac/release/classes")
        from("${buildDir}/intermediates/classes/release")
        include "**/*.class"
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.register("packageDex") {
        dependsOn "classesJar"

        doLast {
            def dexDir = new File(rootDir, "outputs")
            dexDir.mkdirs()
            new File(dexDir, "bubble-outline.dex").delete()
            new File(dexDir, "classes.dex").delete()

            def sdkDir = android.sdkDirectory
            def buildTools = new File(sdkDir, "build-tools")
            def latestTools = findLatestBuildTools(buildTools)
            if (latestTools == null) {
                throw new GradleException("build-tools not found in ${buildTools.path}")
            }
            def d8 = new File(latestTools, isWindows ? "d8.bat" : "d8")
            if (!d8.exists()) {
                throw new GradleException("d8 not found in ${latestTools.path}")
            }

            def classesJar = new File(buildDir, "intermediates/classes.jar")
            if (!classesJar.exists()) {
                throw new GradleException("classes.jar missing: ${classesJar.path}")
            }

            def d8Args = ["--output", dexDir.absolutePath, "--min-api", "21"]
            android.bootClasspath.each { d8Args << "--lib" << it.absolutePath }
            d8Args << classesJar.absolutePath

            if (isWindows) {
                project.exec {
                    executable "cmd"
                    args "/c", d8.absolutePath, *d8Args
                }
            } else {
                project.exec {
                    executable d8.absolutePath
                    args d8Args
                }
            }

            def classesDex = new File(dexDir, "classes.dex")
            if (classesDex.exists()) {
                if (!classesDex.renameTo(new File(dexDir, "bubble-outline.dex"))) {
                    throw new GradleException("could not rename classes.dex to bubble-outline.dex")
                }
            }
        }
    }
}